<!-- @dsCard group="Components" viewport="700x200" name="Progress" subtitle="led bar, ammo cells, day pills — lit means earned" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .pane { border-radius: 20px; padding: 18px; }
    .pane[data-theme="graphite"] { background: var(--ds-graphite-bg); }
    .cap { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.16em; color: var(--ds-concrete); }
  </style>
</head>
<body>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <div id="root"></div>
  <script type="text/babel">
    const NS = window[Object.keys(window).find(k => /^DadStrength/.test(k))] || {};
    const { LedBar, AmmoCells, DayPills, Tile } = NS;
    const days = [{label:"mon",done:true},{label:"wed",done:true},{label:"fri"},{label:"sat"}];
    function Set({ theme }) {
      return (
        <div className="pane" data-theme={theme} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div className="cap">{theme || "chalk"}</div>
          <Tile>
            <LedBar total={4} lit={2} label="2 of 4 spent" />
            <LedBar total={4} lit={4} label="done" />
            <AmmoCells total={5} spent={3} />
            <DayPills days={days} />
          </Tile>
        </div>
      );
    }
    function Demo() { return <div className="pair"><Set /><Set theme="graphite" /></div>; }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
