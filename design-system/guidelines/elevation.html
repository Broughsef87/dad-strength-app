<!-- @dsCard group="Spacing" viewport="700x170" name="elevation" subtitle="tiles float on shadow — borders are sparing" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 20px; padding: 6px;">
    <div style="width: 180px; height: 92px; border-radius: 20px; background: var(--ds-tile); box-shadow: var(--ds-shadow-tile);"></div>
    <div style="width: 180px; height: 92px; border-radius: 20px; background: var(--ds-tile); box-shadow: var(--ds-shadow-tile-raised);"></div>
    <div class="dark" data-theme="graphite" style="display: flex; gap: 20px;">
      <div style="width: 150px; height: 92px; border-radius: 20px; background: var(--ds-tile); box-shadow: var(--ds-shadow-tile);"></div>
    </div>
  </div>
</body>
</html>
