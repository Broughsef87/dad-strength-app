<!-- @dsCard group="Colors" viewport="700x150" name="chalk ground" subtitle="the light ground — background, tile, recessed, line, ink, concrete" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row">
      <div class="col">
        <div class="sw" style="background: #FAF9F6; border: 1px solid var(--ds-chalk-line);"></div>
        <div class="lab">background</div>
        <div class="val">#FAF9F6</div>
      </div>
      <div class="col">
        <div class="sw" style="background: #FFFFFF; border: 1px solid var(--ds-chalk-line);"></div>
        <div class="lab">tile</div>
        <div class="val">#FFFFFF</div>
      </div>
      <div class="col">
        <div class="sw" style="background: #F4F2EC; border: 1px solid var(--ds-chalk-line);"></div>
        <div class="lab">recessed</div>
        <div class="val">#F4F2EC</div>
      </div>
      <div class="col">
        <div class="sw" style="background: #E9E7DF;"></div>
        <div class="lab">line / fill</div>
        <div class="val">#E9E7DF</div>
      </div>
      <div class="col">
        <div class="sw" style="background: #141412;"></div>
        <div class="lab">ink</div>
        <div class="val">#141412 · 17.5:1</div>
      </div>
      <div class="col">
        <div class="sw" style="background: #6F6F68;"></div>
        <div class="lab">concrete</div>
        <div class="val">#6F6F68 · 4.8:1</div>
      </div>
  </div>
</body>
</html>
