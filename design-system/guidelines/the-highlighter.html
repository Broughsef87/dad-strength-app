<!-- @dsCard group="Brand" viewport="700x170" name="the highlighter" subtitle="a 6px volt slab — the one shape that cannot read as a button" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 24px;">
    <div class="col">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">back squat</span>
        <span style="background: var(--ds-volt-chalk); color: #131608; border-radius: 6px; padding: 2px 8px; font-family: var(--ds-font-mono); font-size: 30px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.05; font-variant-numeric: tabular-nums;">185</span>
      </div>
      <div class="lab">the slab marks the prescribed load, and nothing else</div>
    </div>
    <div class="col">
      <span style="background: var(--ds-volt-chalk); color: #131608; border-radius: 999px; padding: 11px 22px; font-size: 14px; font-weight: 600;">start session</span>
      <div class="lab">every control is a pill — that is why the slab is squared</div>
    </div>
  </div>
</body>
</html>
