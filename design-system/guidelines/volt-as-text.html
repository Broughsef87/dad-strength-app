<!-- @dsCard group="Colors" viewport="700x160" name="volt as text" subtitle="volt used as text — brand-text on chalk, volt itself on graphite" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 20px; align-items: stretch;">
    <div class="col" style="background: #FAF9F6; border: 1px solid #E9E7DF; border-radius: 14px; padding: 14px;">
      <div style="font-family: var(--ds-font-mono); font-size: 22px; font-weight: 600; color: #5C7A0E;">week logged</div>
      <div class="lab">brand-text · chalk</div>
      <div class="val">#5C7A0E · 4.7:1</div>
    </div>
    <div class="col" style="background: #0E0F10; border-radius: 14px; padding: 14px;">
      <div style="font-family: var(--ds-font-mono); font-size: 22px; font-weight: 600; color: #CDFF4D;">week logged</div>
      <div class="lab" style="color: #8B8B85;">brand-text · graphite</div>
      <div class="val" style="color: #8B8B85;">#CDFF4D · 16.5:1</div>
    </div>
    <div class="col" style="background: #FFFFFF; border: 1px solid #E9E7DF; border-radius: 14px; padding: 14px;">
      <div style="font-family: var(--ds-font-mono); font-size: 22px; font-weight: 600; color: #C6FF3F;">week logged</div>
      <div class="lab" style="color: #AE2929;">prohibited</div>
      <div class="val" style="color: #AE2929;">#C6FF3F · 1.18:1</div>
    </div>
  </div>
</body>
</html>
