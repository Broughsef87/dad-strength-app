<!-- @dsCard group="Type" viewport="700x200" name="display scale" subtitle="space grotesk 700 / 600 — lowercase, tight tracking" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="col" style="gap: 12px;">
    <div style="font-size: 52px; font-weight: 700; letter-spacing: -0.045em; line-height: 0.92;">pick a path</div>
    <div style="font-size: 34px; font-weight: 600; letter-spacing: -0.03em;">the week</div>
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">back squat</div>
  </div>
</body>
</html>
