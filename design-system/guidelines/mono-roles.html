<!-- @dsCard group="Type" viewport="700x180" name="mono roles" subtitle="eyebrow-mono for metadata, data-mono for what the engine prints" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="col" style="gap: 12px;">
    <div style="font-family: var(--ds-font-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--ds-concrete);">wk 3 · day 2</div>
    <div style="font-family: var(--ds-font-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--ds-concrete);">lb @ 65% · 4×5 · tgt rpe 7</div>
    <div style="font-family: var(--ds-font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">45·10·10·2.5 /side</div>
    <div style="font-family: var(--ds-font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">rpe 7 · 65% · wk 3</div>
  </div>
</body>
</html>
