<!-- @dsCard group="Brand" viewport="700x200" name="prohibited" subtitle="volt as text on chalk · an ink at 60% · a rainbow of categories" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 16px; align-items: stretch;">
    <div class="col" style="background: var(--ds-tile); border-radius: 14px; padding: 14px;">
      <div style="font-family: var(--ds-font-mono); font-size: 30px; font-weight: 600; letter-spacing: -0.045em; color: #C6FF3F;">185</div>
      <div class="lab" style="color: #AE2929;">volt as text · 1.18:1</div>
    </div>
    <div class="col" style="background: var(--ds-tile); border-radius: 14px; padding: 14px;">
      <div style="font-size: 15px; color: rgba(20,20,18,0.6);">four working sets, then you're done.</div>
      <div class="lab" style="color: #AE2929;">ink at 60% — use concrete</div>
    </div>
    <div class="col" style="background: var(--ds-tile); border-radius: 14px; padding: 14px;">
      <div class="row" style="gap: 5px;">
        <span style="padding: 4px 9px; border-radius: 999px; background: #FFE3E3; color: #D62828; font-size: 12px;">chest</span>
        <span style="padding: 4px 9px; border-radius: 999px; background: #E3F0FF; color: #1E6FFF; font-size: 12px;">back</span>
        <span style="padding: 4px 9px; border-radius: 999px; background: #FFF3D6; color: #C98A00; font-size: 12px;">quads</span>
        <span style="padding: 4px 9px; border-radius: 999px; background: #F1E3FF; color: #7C3AED; font-size: 12px;">abs</span>
      </div>
      <div class="lab" style="color: #AE2929;">one hue per label, plus amber</div>
    </div>
  </div>
</body>
</html>
