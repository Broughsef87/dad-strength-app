<!-- @dsCard group="Spacing" viewport="700x140" name="spacing scale" subtitle="4 · 6 · 8 · 10 · 14 · 20 · 28 · 40 · 64 — 10 is the addition" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 10px; align-items: flex-end;">
    <div class="col"><div style="width: 4px; height: 40px; background: var(--ds-ink);"></div><div class="lab">4</div></div>
    <div class="col"><div style="width: 6px; height: 40px; background: var(--ds-ink);"></div><div class="lab">6</div></div>
    <div class="col"><div style="width: 8px; height: 40px; background: var(--ds-ink);"></div><div class="lab">8</div></div>
    <div class="col"><div style="width: 10px; height: 40px; background: var(--ds-volt-deep-chalk);"></div><div class="lab">10</div></div>
    <div class="col"><div style="width: 14px; height: 40px; background: var(--ds-ink);"></div><div class="lab">14</div></div>
    <div class="col"><div style="width: 20px; height: 40px; background: var(--ds-ink);"></div><div class="lab">20</div></div>
    <div class="col"><div style="width: 28px; height: 40px; background: var(--ds-ink);"></div><div class="lab">28</div></div>
    <div class="col"><div style="width: 40px; height: 40px; background: var(--ds-ink);"></div><div class="lab">40</div></div>
    <div class="col"><div style="width: 64px; height: 40px; background: var(--ds-ink);"></div><div class="lab">64</div></div>
  </div>
</body>
</html>
