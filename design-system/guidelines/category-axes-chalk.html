<!-- @dsCard group="Colors" viewport="700x130" name="category axes chalk" subtitle="six axes on chalk — desaturated ink on its own 10% tint" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 8px;">
    <span style="padding: 6px 14px; border-radius: 999px; background: var(--ds-cat-push-tint); color: var(--ds-cat-push-ink); font-size: 13px; font-weight: 500;">push</span>
    <span style="padding: 6px 14px; border-radius: 999px; background: var(--ds-cat-pull-tint); color: var(--ds-cat-pull-ink); font-size: 13px; font-weight: 500;">pull</span>
    <span style="padding: 6px 14px; border-radius: 999px; background: var(--ds-cat-legs-tint); color: var(--ds-cat-legs-ink); font-size: 13px; font-weight: 500;">legs</span>
    <span style="padding: 6px 14px; border-radius: 999px; background: var(--ds-cat-core-tint); color: var(--ds-cat-core-ink); font-size: 13px; font-weight: 500;">core</span>
    <span style="padding: 6px 14px; border-radius: 999px; background: var(--ds-cat-condition-tint); color: var(--ds-cat-condition-ink); font-size: 13px; font-weight: 500;">condition</span>
    <span style="padding: 6px 14px; border-radius: 999px; background: var(--ds-cat-general-tint); color: var(--ds-cat-general-ink); font-size: 13px; font-weight: 500;">general</span>
  </div>
  <div class="lab" style="margin-top: 14px;">a chip already says the muscle. color is only grouping — 5.4:1 floor on tint.</div>
</body>
</html>
