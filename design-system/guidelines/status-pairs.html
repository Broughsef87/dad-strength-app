<!-- @dsCard group="Colors" viewport="700x160" name="status pairs" subtitle="good and danger as fill / ink pairs — there is no warning color" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 20px;">
    <div class="col">
      <div class="row" style="gap: 8px;">
        <div class="sw" style="width: 56px; background: #C6FF3F;"></div>
        <div class="sw" style="width: 56px; background: #FAF9F6; border: 1px solid #E9E7DF; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #5C7A0E;">A</div>
      </div>
      <div class="lab">good · chalk</div>
      <div class="val">#C6FF3F / #5C7A0E · 4.7:1</div>
    </div>
    <div class="col">
      <div class="row" style="gap: 8px;">
        <div class="sw" style="width: 56px; background: #AE2929;"></div>
        <div class="sw" style="width: 56px; background: #FAF9F6; border: 1px solid #E9E7DF; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #AE2929;">A</div>
      </div>
      <div class="lab">danger · chalk</div>
      <div class="val">#AE2929 · 6.3:1</div>
    </div>
    <div class="col">
      <div class="row" style="gap: 8px;">
        <div class="sw" style="width: 56px; background: #BE2D2D;"></div>
        <div class="sw" style="width: 56px; background: #0E0F10; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #DA6262;">A</div>
      </div>
      <div class="lab">danger · graphite</div>
      <div class="val">#BE2D2D / #DA6262 · 5.4:1</div>
    </div>
  </div>
</body>
</html>
