<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="col" style="gap: 12px; max-width: 640px;">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.03em;">start session</div>
    <div style="font-size: 15px; font-weight: 300; line-height: 1.65;">morning done. test week starts monday — pick a path.</div>
    <div style="font-family: var(--ds-font-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--ds-concrete);">pilot authentication</div>
    <div style="font-family: var(--ds-font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--ds-concrete);">DS-01 // built for the long haul</div>
  </div>
</body>
</html>
