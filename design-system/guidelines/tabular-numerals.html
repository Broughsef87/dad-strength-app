<!-- @dsCard group="Type" viewport="700x150" name="tabular numerals" subtitle="digits never shift between renders" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="col" style="gap: 6px;">
    <div style="font-family: var(--ds-font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums;">111 · 185 · 225</div>
    <div style="font-family: var(--ds-font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums;">100 · 180 · 220</div>
    <div class="lab">tabular-nums, always</div>
  </div>
</body>
</html>
