<!-- @dsCard group="Brand" viewport="700x180" name="brand marks" subtitle="plate stack on the slab — new marks, proposed not recovered" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 22px;">
    <div class="col"><img src="../assets/ds-mark-volt.svg" width="72" height="72" alt="mark"><div class="lab">volt · 72px</div></div>
    <div class="col"><img src="../assets/ds-mark-slab.svg" width="72" height="72" alt="slab mark"><div class="lab">slab lockup</div></div>
    <div class="col"><img src="../assets/ds-mark-ink.svg" width="72" height="72" alt="ink mark"><div class="lab">ink · one-color</div></div>
    <div class="col"><img src="../assets/ds-mark-bare.svg" width="72" height="72" alt="bare mark"><div class="lab">bare glyph</div></div>
    <div class="col" style="gap: 6px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="../assets/ds-mark-volt.svg" width="34" height="34" alt="mark">
        <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.03em;">dad strength</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="../assets/ds-mark-volt.svg" width="20" height="20" alt="mark">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.02em;">dad strength</span>
      </div>
      <div class="lab">horizontal lockup · 34px and 20px floor</div>
    </div>
  </div>
</body>
</html>
