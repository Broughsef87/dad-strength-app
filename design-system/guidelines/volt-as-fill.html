<!-- @dsCard group="Colors" viewport="700x170" name="volt as fill" subtitle="the only accent — a fill with brand-ink on top, never an ink on light" -->
<!doctype html>
<html>
<head>

  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--ds-background); color: var(--ds-ink); font-family: var(--ds-font-sans); padding: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .sw { width: 76px; height: 56px; border-radius: 12px; flex: none; }
    .lab { font-family: var(--ds-font-mono); font-size: 9px; letter-spacing: 0.12em; color: var(--ds-concrete); }
    .val { font-family: var(--ds-font-mono); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .dark { background: var(--ds-graphite-bg); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div class="row" style="gap: 20px;">
    <div class="col">
      <div style="width: 150px; height: 62px; border-radius: 12px; background: #C6FF3F; color: #131608; display: flex; align-items: center; justify-content: center; font-family: var(--ds-font-mono); font-size: 26px; font-weight: 600; letter-spacing: -0.045em;">185</div>
      <div class="lab">volt + brand-ink · chalk</div>
      <div class="val">#C6FF3F / #131608 · 15.5:1</div>
    </div>
    <div class="col">
      <div style="width: 150px; height: 62px; border-radius: 12px; background: #CDFF4D; color: #131608; display: flex; align-items: center; justify-content: center; font-family: var(--ds-font-mono); font-size: 26px; font-weight: 600; letter-spacing: -0.045em;">185</div>
      <div class="lab">volt + brand-ink · graphite</div>
      <div class="val">#CDFF4D / #131608 · 15.7:1</div>
    </div>
    <div class="col">
      <div style="width: 150px; height: 62px; border-radius: 12px; background: #A8E32A;"></div>
      <div class="lab">volt-deep · pressed</div>
      <div class="val">#A8E32A / #B7EE33</div>
    </div>
  </div>
</body>
</html>
